<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDC 부품 재고 현황</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#243449; --line:#334155;
    --text:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; --accent2:#0ea5e9;
    --ok:#22c55e; --warn:#f59e0b; --danger:#ef4444;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;
    background:var(--bg);color:var(--text);font-size:14px}
  header{background:linear-gradient(135deg,#0ea5e9,#1e40af);padding:20px 24px}
  header h1{margin:0;font-size:20px;font-weight:700}
  header p{margin:4px 0 0;color:#cfe8ff;font-size:13px}
  .wrap{max-width:1200px;margin:0 auto;padding:20px 24px}
  .bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:16px}
  .bar label{color:var(--muted);font-size:13px;margin-right:6px}
  input,select,button{font-family:inherit;font-size:14px}
  input[type=date],input[type=text],input[type=number],select{
    background:var(--panel2);border:1px solid var(--line);color:var(--text);
    padding:8px 10px;border-radius:8px;outline:none}
  input:focus,select:focus{border-color:var(--accent)}
  button{cursor:pointer;border:none;border-radius:8px;padding:8px 14px;font-weight:600}
  .btn-primary{background:var(--accent2);color:#fff}
  .btn-primary:hover{background:var(--accent)}
  .btn-ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
  .btn-ghost:hover{border-color:var(--accent)}
  .btn-sm{padding:5px 10px;font-size:12px}
  .btn-danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
  .btn-danger:hover{background:var(--danger);color:#fff}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .card .n{font-size:26px;font-weight:700}
  .card .l{color:var(--muted);font-size:12px;margin-top:2px}
  .card.alert{border-color:var(--danger)}
  .card.alert .n{color:var(--danger)}
  .alert-box{background:rgba(239,68,68,.12);border:1px solid var(--danger);border-radius:12px;
    padding:14px 16px;margin-bottom:20px}
  .alert-box h3{margin:0 0 6px;font-size:14px;color:#fca5a5}
  .alert-box .chip{display:inline-block;background:rgba(239,68,68,.25);color:#fecaca;
    padding:3px 10px;border-radius:20px;font-size:12px;margin:3px 4px 0 0}
  table{width:100%;border-collapse:collapse;background:var(--panel);border-radius:12px;overflow:hidden}
  th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line)}
  th{background:var(--panel2);color:var(--muted);font-size:12px;font-weight:600;
    text-transform:uppercase;letter-spacing:.03em;cursor:pointer;user-select:none}
  th:hover{color:var(--text)}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:rgba(56,189,248,.05)}
  .status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
    padding:3px 10px;border-radius:20px}
  .status.ok{background:rgba(34,197,94,.15);color:#4ade80}
  .status.low{background:rgba(245,158,11,.15);color:#fbbf24}
  .status.out{background:rgba(239,68,68,.15);color:#f87171}
  .qty{font-weight:700;font-size:15px}
  .muted{color:var(--muted)}
  .right{text-align:right}
  .section-title{display:flex;align-items:center;justify-content:space-between;margin:24px 0 12px}
  .section-title h2{font-size:16px;margin:0}
  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;
    align-items:center;justify-content:center;padding:20px;z-index:50}
  .overlay.on{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;width:100%;max-width:420px}
  .modal h3{margin:0 0 16px;font-size:16px}
  .field{margin-bottom:12px}
  .field label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}
  .field input,.field select{width:100%}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .empty{text-align:center;color:var(--muted);padding:40px}
  .hint{color:var(--muted);font-size:12px;margin-top:6px}
  .badge{background:var(--panel2);border:1px solid var(--line);color:var(--muted);
    padding:2px 8px;border-radius:6px;font-size:11px}
</style>
</head>
<body>
<header>
  <h1>🏢 IDC 부품 재고 현황</h1>
  <p>날짜별 재고 조회 · 부족 재고 알림 · 직접 입력/수정 (데이터는 이 브라우저에 저장됩니다)</p>
</header>

<div class="wrap">
  <div class="bar">
    <div><label>조회 날짜</label><input type="date" id="asOfDate"></div>
    <div><label>위치</label>
      <select id="idcFilter"><option value="">전체</option></select>
    </div>
    <div><input type="text" id="search" placeholder="🔍 부품명 / 카테고리 검색" style="width:220px"></div>
    <div style="flex:1"></div>
    <button class="btn-ghost" id="btnManageParts">부품 관리</button>
    <button class="btn-primary" id="btnAddRecord">＋ 재고 입력</button>
  </div>

  <div class="cards" id="cards"></div>

  <div id="alertBox"></div>

  <div class="section-title">
    <h2>재고 목록 <span class="badge" id="asOfLabel"></span></h2>
    <span class="hint">행의 재고 값을 클릭하면 해당 날짜 기준으로 바로 수정할 수 있어요</span>
  </div>
  <table id="tbl">
    <thead>
      <tr>
        <th data-sort="name">부품명</th>
        <th data-sort="category">카테고리</th>
        <th data-sort="idc">위치</th>
        <th data-sort="qty" class="right">재고</th>
        <th data-sort="safety" class="right">안전재고</th>
        <th data-sort="status">상태</th>
        <th>최근 갱신</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<!-- 재고 입력 모달 -->
<div class="overlay" id="recordModal">
  <div class="modal">
    <h3>재고 입력 / 수정</h3>
    <div class="field">
      <label>부품</label>
      <select id="rPart"></select>
    </div>
    <div class="field">
      <label>날짜</label>
      <input type="date" id="rDate">
    </div>
    <div class="field">
      <label>재고 수량</label>
      <input type="number" id="rQty" min="0" placeholder="예: 120">
    </div>
    <div class="hint">같은 날짜에 다시 입력하면 해당 날짜의 값이 갱신됩니다.</div>
    <div class="modal-actions">
      <button class="btn-ghost" data-close>취소</button>
      <button class="btn-primary" id="rSave">저장</button>
    </div>
  </div>
</div>

<!-- 부품 관리 모달 -->
<div class="overlay" id="partsModal">
  <div class="modal" style="max-width:560px">
    <h3>부품 관리</h3>
    <table style="margin-bottom:14px">
      <thead><tr><th>부품명</th><th>카테고리</th><th>위치</th><th class="right">안전재고</th><th></th></tr></thead>
      <tbody id="partsTbody"></tbody>
    </table>
    <div style="border-top:1px solid var(--line);padding-top:14px">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div class="field"><label>부품명</label><input type="text" id="pName" placeholder="예: SFP+ 10G 모듈"></div>
        <div class="field"><label>카테고리</label><input type="text" id="pCat" placeholder="예: 네트워크"></div>
        <div class="field"><label>위치</label><input type="text" id="pIdc" placeholder="예: 가산 IDC A-12랙"></div>
        <div class="field"><label>안전재고</label><input type="number" id="pSafety" min="0" placeholder="예: 10"></div>
      </div>
      <button class="btn-primary" id="pAdd" style="width:100%">＋ 부품 추가</button>
    </div>
    <div class="modal-actions"><button class="btn-ghost" data-close>닫기</button></div>
  </div>
</div>

<script>
const KEY = 'idc_inventory_v1';
const todayStr = () => new Date().toISOString().slice(0,10);

// ---------- data ----------
let db = load();
function load(){
  try{ const d = JSON.parse(localStorage.getItem(KEY)); if(d && d.parts) return d; }catch(e){}
  return seed();
}
function save(){ localStorage.setItem(KEY, JSON.stringify(db)); }
function seed(){
  const d = todayStr();
  const dm = (n)=>{const x=new Date(); x.setDate(x.getDate()-n); return x.toISOString().slice(0,10);};
  const data = {parts:[
    {id:'p1',name:'SFP+ 10G 모듈',category:'네트워크',idc:'가산 IDC',safety:20,
      records:[{date:dm(30),qty:60},{date:dm(14),qty:42},{date:dm(3),qty:15}]},
    {id:'p2',name:'DDR4 32GB RDIMM',category:'서버',idc:'가산 IDC',safety:30,
      records:[{date:dm(30),qty:120},{date:dm(10),qty:80},{date:dm(2),qty:55}]},
    {id:'p3',name:'2.5" SSD 1.92TB',category:'스토리지',idc:'평촌 IDC',safety:15,
      records:[{date:dm(25),qty:40},{date:dm(7),qty:22},{date:dm(1),qty:8}]},
    {id:'p4',name:'전원 케이블 C13-C14',category:'전원',idc:'평촌 IDC',safety:50,
      records:[{date:dm(20),qty:200},{date:dm(5),qty:140}]},
    {id:'p5',name:'RJ45 패치코드 1m',category:'네트워크',idc:'가산 IDC',safety:100,
      records:[{date:dm(18),qty:300},{date:dm(4),qty:260}]},
    {id:'p6',name:'서버 팬 모듈',category:'서버',idc:'평촌 IDC',safety:12,
      records:[{date:dm(12),qty:18},{date:dm(2),qty:6}]},
  ]};
  return data;
}

// stock as of a date = latest record with date <= asOf
function stockAsOf(part, asOf){
  let best=null;
  for(const r of part.records){ if(r.date<=asOf && (!best || r.date>best.date)) best=r; }
  return best; // {date,qty} or null
}
function statusOf(qty, safety){
  if(qty===null) return {k:'na',t:'데이터 없음'};
  if(qty<=0) return {k:'out',t:'품절'};
  if(qty<safety) return {k:'low',t:'부족'};
  return {k:'ok',t:'정상'};
}

// ---------- render ----------
let sortKey='status', sortDir=1;
const $=(s)=>document.querySelector(s);

function refreshIdcFilter(){
  const sel=$('#idcFilter'); const cur=sel.value;
  const idcs=[...new Set(db.parts.map(p=>p.idc))].sort();
  sel.innerHTML='<option value="">전체</option>'+idcs.map(i=>`<option>${esc(i)}</option>`).join('');
  sel.value=cur;
}

function computeRows(){
  const asOf=$('#asOfDate').value||todayStr();
  const idc=$('#idcFilter').value;
  const q=$('#search').value.trim().toLowerCase();
  let rows=db.parts.map(p=>{
    const s=stockAsOf(p,asOf);
    const qty=s?s.qty:null;
    const st=statusOf(qty,p.safety);
    return {id:p.id,name:p.name,category:p.category,idc:p.idc,safety:p.safety,
      qty,updated:s?s.date:null,status:st};
  });
  if(idc) rows=rows.filter(r=>r.idc===idc);
  if(q) rows=rows.filter(r=>r.name.toLowerCase().includes(q)||r.category.toLowerCase().includes(q));
  const rank={out:0,low:1,ok:2,na:3};
  rows.sort((a,b)=>{
    let av,bv;
    if(sortKey==='status'){av=rank[a.status.k];bv=rank[b.status.k];}
    else if(sortKey==='qty'||sortKey==='safety'){av=a[sortKey]??-1;bv=b[sortKey]??-1;}
    else {av=(a[sortKey]||'').toString();bv=(b[sortKey]||'').toString();return av.localeCompare(bv,'ko')*sortDir;}
    return (av-bv)*sortDir;
  });
  return {rows,asOf};
}

function render(){
  const {rows,asOf}=computeRows();
  $('#asOfLabel').textContent=asOf+' 기준';
  // cards
  const total=rows.length;
  const low=rows.filter(r=>r.status.k==='low').length;
  const out=rows.filter(r=>r.status.k==='out').length;
  const ok=rows.filter(r=>r.status.k==='ok').length;
  $('#cards').innerHTML=`
    <div class="card"><div class="n">${total}</div><div class="l">조회된 부품</div></div>
    <div class="card"><div class="n" style="color:var(--ok)">${ok}</div><div class="l">정상</div></div>
    <div class="card ${low?'alert':''}"><div class="n" style="color:var(--warn)">${low}</div><div class="l">부족 (안전재고 미만)</div></div>
    <div class="card ${out?'alert':''}"><div class="n">${out}</div><div class="l">품절</div></div>`;
  // alert box
  const alerts=rows.filter(r=>r.status.k==='low'||r.status.k==='out');
  $('#alertBox').innerHTML = alerts.length? `
    <div class="alert-box">
      <h3>⚠️ 부족 재고 알림 — ${alerts.length}건</h3>
      ${alerts.map(r=>`<span class="chip">${esc(r.name)} · ${r.qty??0}개 / 안전 ${r.safety}</span>`).join('')}
    </div>`:'';
  // table
  const tb=$('#tbody');
  if(!rows.length){ tb.innerHTML=`<tr><td colspan="8"><div class="empty">표시할 부품이 없습니다.</div></td></tr>`; return; }
  tb.innerHTML=rows.map(r=>`
    <tr>
      <td><strong>${esc(r.name)}</strong></td>
      <td class="muted">${esc(r.category)}</td>
      <td>${esc(r.idc)}</td>
      <td class="right qty" style="cursor:pointer" title="클릭하여 ${asOf} 재고 수정"
          onclick="quickEdit('${r.id}')">${r.qty===null?'<span class="muted">—</span>':r.qty}</td>
      <td class="right muted">${r.safety}</td>
      <td><span class="status ${r.status.k==='na'?'':r.status.k}">${statusDot(r.status.k)}${r.status.t}</span></td>
      <td class="muted">${r.updated||'—'}</td>
      <td class="right"><button class="btn-ghost btn-sm" onclick="openRecord('${r.id}')">입력</button></td>
    </tr>`).join('');
}
function statusDot(k){const c={ok:'var(--ok)',low:'var(--warn)',out:'var(--danger)'}[k]||'var(--muted)';
  return `<span style="width:7px;height:7px;border-radius:50%;background:${c};display:inline-block"></span>`;}
function esc(s){return (s+'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

// ---------- record input ----------
function openRecord(partId){
  const sel=$('#rPart');
  sel.innerHTML=db.parts.map(p=>`<option value="${p.id}">${esc(p.name)} (${esc(p.idc)})</option>`).join('');
  sel.value=partId||db.parts[0]?.id||'';
  $('#rDate').value=$('#asOfDate').value||todayStr();
  $('#rQty').value='';
  $('#recordModal').classList.add('on');
}
function quickEdit(partId){ openRecord(partId); $('#rQty').focus(); }
$('#rSave').onclick=()=>{
  const pid=$('#rPart').value, date=$('#rDate').value, qty=parseInt($('#rQty').value,10);
  if(!pid||!date||isNaN(qty)){alert('부품, 날짜, 수량을 모두 입력하세요.');return;}
  const p=db.parts.find(x=>x.id===pid);
  const ex=p.records.find(r=>r.date===date);
  if(ex) ex.qty=qty; else p.records.push({date,qty});
  p.records.sort((a,b)=>a.date.localeCompare(b.date));
  save(); closeModals(); render();
};

// ---------- parts management ----------
function openParts(){ renderParts(); $('#partsModal').classList.add('on'); }
function renderParts(){
  $('#partsTbody').innerHTML=db.parts.map(p=>`
    <tr>
      <td><input type="text" value="${esc(p.name)}" onchange="editPart('${p.id}','name',this.value)" style="width:100%"></td>
      <td><input type="text" value="${esc(p.category)}" onchange="editPart('${p.id}','category',this.value)" style="width:100%"></td>
      <td><input type="text" value="${esc(p.idc)}" onchange="editPart('${p.id}','idc',this.value)" style="width:100%"></td>
      <td class="right"><input type="number" value="${p.safety}" onchange="editPart('${p.id}','safety',this.value)" style="width:70px"></td>
      <td><button class="btn-danger btn-sm" onclick="delPart('${p.id}')">삭제</button></td>
    </tr>`).join('') || `<tr><td colspan="5"><div class="empty">부품이 없습니다.</div></td></tr>`;
}
function editPart(id,field,val){
  const p=db.parts.find(x=>x.id===id); if(!p)return;
  p[field]= field==='safety'? Math.max(0,parseInt(val,10)||0) : val;
  save(); refreshIdcFilter(); render();
}
function delPart(id){
  if(!confirm('이 부품과 모든 재고 기록을 삭제할까요?'))return;
  db.parts=db.parts.filter(x=>x.id!==id);
  save(); renderParts(); refreshIdcFilter(); render();
}
$('#pAdd').onclick=()=>{
  const name=$('#pName').value.trim();
  if(!name){alert('부품명을 입력하세요.');return;}
  db.parts.push({id:'p'+Date.now(),name,category:$('#pCat').value.trim()||'기타',
    idc:$('#pIdc').value.trim()||'미지정',safety:Math.max(0,parseInt($('#pSafety').value,10)||0),records:[]});
  $('#pName').value=$('#pCat').value=$('#pIdc').value=$('#pSafety').value='';
  save(); renderParts(); refreshIdcFilter(); render();
};

// ---------- misc ----------
function closeModals(){document.querySelectorAll('.overlay').forEach(o=>o.classList.remove('on'));}
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModals);
document.querySelectorAll('.overlay').forEach(o=>o.onclick=e=>{if(e.target===o)closeModals();});
document.querySelectorAll('th[data-sort]').forEach(th=>th.onclick=()=>{
  const k=th.dataset.sort;
  if(sortKey===k) sortDir*=-1; else {sortKey=k;sortDir=1;}
  render();
});
$('#btnAddRecord').onclick=()=>openRecord();
$('#btnManageParts').onclick=openParts;
$('#asOfDate').onchange=render;
$('#idcFilter').onchange=render;
$('#search').oninput=render;
window.openRecord=openRecord; window.quickEdit=quickEdit;
window.editPart=editPart; window.delPart=delPart;

// init
$('#asOfDate').value=todayStr();
refreshIdcFilter();
render();
</script>
</body>
</html>
